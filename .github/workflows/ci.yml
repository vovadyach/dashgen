name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code, so its token can't write anything.
permissions:
  contents: read

# A newer push to a pull request's branch cancels the run that's still going.
# On main, it waits instead, so a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: scripts/check.sh

  # The page goes live from main, once the checks pass, with the runbook's
  # commands (docs/runbooks/deploy.md#the-page). A pull request never deploys.
  deploy-page:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token lets the job ask GitHub for a token that AWS trades for the
    # page_deploy role (infra/aws/always-on/github.tf). The repo stays
    # read-only.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm run build --workspace frontend
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PAGE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          # The repo is public, and so are these logs: the account ID, which
          # is in the role and the bucket's name, shows as ***.
          mask-aws-account-id: true
      # The assets first, then index.html, which names them. The step stops
      # at the first command that fails.
      - run: |
          aws s3 sync frontend/dist/assets "s3://$BUCKET/assets" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
        env:
          BUCKET: ${{ secrets.AWS_SITE_BUCKET }}

  # The backend's image from main, once the checks pass (ADR-0017,
  # docs/runbooks/deploy.md#the-backends-image): built on GitHub's ARM runner,
  # for Fargate's ARM CPUs, pushed to ECR, and deployed when a session runs
  # main. A pull request never builds or deploys.
  deploy-backend:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    # About 10 minutes, but up to 30 more can go to waiting for another
    # deploy to finish, as deploys take turns (scripts/aws-session.sh).
    timeout-minutes: 45
    # id-token lets the job ask GitHub for a token that AWS trades for the
    # backend_deploy role (infra/aws/always-on/github.tf).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # main's whole history, so the deploy can tell whether main's image
          # comes from a newer commit than this run's.
          fetch-depth: 0
      # The deploy's steps run small Node scripts, on the repo's Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          # The account ID is in the role and the image's address: it shows
          # as *** in these public logs.
          mask-aws-account-id: true
      - run: scripts/ci-deploy-backend.sh
