name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code, so its token can't write anything.
permissions:
  contents: read

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: metrics/go.mod
          cache: false # no Go dependencies yet, so nothing to cache
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-python: true
      - run: scripts/check.sh
