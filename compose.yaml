# Local development. `make db` starts Postgres and DynamoDB Local. The
# passwords come from .env, which `cp .env.example .env` creates.
name: dashgen

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      # Read only by the init script, which creates the backend's user.
      DASHGEN_DB_PASSWORD: ${DASHGEN_DB_PASSWORD:?copy .env.example to .env}
    # Reachable from this machine only, not from the rest of the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      # Runs once, the first time Postgres starts with an empty volume.
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # Over TCP, because while the init script runs Postgres listens only on
      # its socket. So this can't pass before the databases exist.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The daily cap's count, in DynamoDB Local. Its tables live in memory, so
  # a restart empties them, and the backend makes its table again when it
  # starts.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    # -sharedDb: one set of tables, whatever keys and region a client uses.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Any HTTP answer, even DynamoDB's 400 for a request with no keys,
      # means it's listening.
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:8000"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
