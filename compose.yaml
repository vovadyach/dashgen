# Local development. `make db` starts Postgres and DynamoDB Local. The
# passwords come from .env, which `cp .env.example .env` creates.
# `docker compose up` also runs the backend in its container, as AWS will.
name: dashgen

# The backend's image, from backend/Dockerfile, for the two services that use it.
x-backend-image: &backend-image
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: dashgen-backend

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      # Read only by the init script, which creates the backend's user.
      DASHGEN_DB_PASSWORD: ${DASHGEN_DB_PASSWORD:?copy .env.example to .env}
    # Reachable from this machine only, not from the rest of the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps its data in /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      # Runs once, the first time Postgres starts with an empty volume.
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # Over TCP, because while the init script runs Postgres listens only on
      # its socket. So this can't pass before the databases exist.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The daily cap's count, in DynamoDB Local. Its tables live in memory, so
  # a restart empties them, and the backend makes its table again when it
  # starts.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    # -sharedDb: one set of tables, whatever keys and region a client uses.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Any HTTP answer, even DynamoDB's 400 for a request with no keys,
      # means it's listening.
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:8000"]
      interval: 1s
      timeout: 5s
      retries: 30

  # Applies the migrations and the seed, then stops: on AWS, a one-off task
  # will do the same before the backend starts (step 5).
  migrate:
    <<: *backend-image
    command: ["sh", "-c", "node src/scripts/migrate.ts && node src/scripts/seed.ts"]
    environment:
      DATABASE_URL: postgres://dashgen:${DASHGEN_DB_PASSWORD:?copy .env.example to .env}@postgres:5432/dashgen
    depends_on:
      postgres:
        condition: service_healthy

  # The backend in its container, on :3000 like `npm run dev`, so stop that
  # first. Its settings come from backend/.env, with the addresses changed to
  # the other containers'. HOST and PORT stay the image's, whatever
  # backend/.env sets for `npm run dev`, so the port below and the health
  # check always reach it.
  backend:
    <<: *backend-image
    env_file: backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://dashgen:${DASHGEN_DB_PASSWORD:?copy .env.example to .env}@postgres:5432/dashgen
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      dynamodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      # Every second while it starts, then every 30 seconds.
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
