<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Ask about five services' errors and latency in plain English, and watch an AI agent turn the question into a chart."
    />
    <title>DashGen</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpolyline points='7,21 13,15 18,19 25,10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Picks the theme before the page draws, so a dark page never flashes
      // white: the visitor's own choice if they made one, else their system's.
      // In a function, so its names don't become the page's globals.
      (() => {
        let saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch {
          // Storage can be blocked, and then the system's choice applies.
        }
        const dark = saved
          ? saved === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
